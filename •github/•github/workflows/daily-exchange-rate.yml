name: Daily Exchange Rate Email

on:
  schedule:
    # Nigeria (WAT) is UTC+1 year-round, no daylight saving.
    # 8:00 AM WAT = 7:00 AM UTC
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # lets you manually trigger a test run from the Actions tab

jobs:
  send-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send exchange rate email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python send_exchange_rate.py
